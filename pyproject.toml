[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servicedesk-whatsapp-automation-demo"
version = "1.0.0"
description = "Human-approved conversational ITSM workflow reference implementation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[tool.setuptools.packages.find]
where = ["src"]
